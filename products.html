<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curated Gift Collection – Yuvagifts</title>
  <meta name="description" content="Explore handcrafted bouquets, artisanal confectionery, and personalized keepsakes. Same-day white glove delivery and complimentary gift presentation.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="wrap">
  <section class="section" style="padding-top:3.5rem;">
    <div class="section-eyebrow">CURATED BOUTIQUE</div>
    <h1 class="section-title">The Master Gift Collection</h1>
    <p class="section-sub">Discover hand-tied botanical bouquets, artisanal gourmet hampers, and bespoke keepsakes crafted for life's most meaningful moments.</p>
    
    <div class="filter-bar">
      <input type="search" id="searchInput" placeholder="Search by gift name, category, or description..." aria-label="Search gifts">
      <select id="categoryFilter" aria-label="Filter by occasion">
        <option value="all">All Celebrations</option>
        <option value="birthday">Birthday Celebrations</option>
        <option value="anniversary">Anniversary Milestones</option>
        <option value="wedding">Wedding &amp; Bridal</option>
        <option value="festival">Festive &amp; Cultural</option>
      </select>
      <select id="sortSelect" aria-label="Sort products">
        <option value="">Sort: Featured Selection</option>
        <option value="popular">Most Popular</option>
        <option value="rating">Highest Rated</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
      </select>
    </div>
    
    <p id="resultCount" class="result-count"></p>
    <div class="product-grid" id="productGrid"></div>
  </section>
</div>

<div id="footer"></div>
<script src="js/main.js"></script>
<script src="js/products.js"></script>
<script>renderAllProducts();</script>
</body>
</html>
