<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Authentication – Yuvagifts</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>

<section class="auth-section admin-auth">
  <div class="auth-card">
    <div style="font-size:2rem; margin-bottom:0.5rem">🔒</div>
    <h2>Internal Portal Access</h2>
    <p class="auth-sub">Secure authentication for store managers &amp; curators.</p>
    <form onsubmit="adminLogin(event)">
      <input type="text" id="adminUser" placeholder="Administrator Username *" required autocomplete="username">
      <input type="password" id="adminPass" placeholder="Security Key / Password *" required autocomplete="current-password">
      <button type="submit" class="btn-primary" style="width:100%">Authenticate &amp; Open Dashboard</button>
    </form>
    <p class="auth-footer" style="color:rgba(255,255,255,0.6)">Authorized personnel only. Demo: <code>admin</code> / <code>admin123</code></p>
  </div>
</section>

<div id="footer"></div>
<script src="js/main.js"></script>
</body>
</html>
